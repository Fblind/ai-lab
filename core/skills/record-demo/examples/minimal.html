<!doctype html><html><head><meta charset="utf-8"><title>Demo shop</title>
<style>body{font:16px system-ui;margin:40px;background:#f8fafc}label{display:block;margin:12px 0}button{padding:8px 16px}#out{margin-top:20px;font-weight:600}</style></head>
<body><h1>Demo shop</h1>
<label>Quantity <input id="qty" type="number" value="1"></label>
<label>Plan <select id="plan"><option>Basic</option><option>Pro</option></select></label>
<label><input id="terms" type="checkbox"> Accept terms</label>
<button id="buy" onclick="document.getElementById('out').textContent = document.getElementById('terms').checked ? 'Order placed: ' + document.getElementById('qty').value + ' x ' + document.getElementById('plan').value : 'Please accept the terms'">Buy</button>
<div id="out"></div></body></html>
